name: Desktop release
on:
  push:
    tags: ['v3.*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify and publish language/platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = v3.0.0
          test "$(find release -name '*.zip' | wc -l)" -eq 4
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "FocusDesk 3.0.0 · macOS & Windows · 中文 / English" --notes-file docs/RELEASE-3.0.0.md release/*.zip release/SHA256SUMS.txt
